name: deviludo-local-control-plane

# Local integration stack. Production must use managed HA equivalents and the
# network/RBAC policies described in docs/architecture.md.
services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: deviludo
      POSTGRES_USER: deviludo
      POSTGRES_PASSWORD: ${DEVILUDO_POSTGRES_PASSWORD:?set DEVILUDO_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/001_core.sql:/docker-entrypoint-initdb.d/001_core.sql:ro
      - ./postgres/002_workflow_dispatch.sql:/docker-entrypoint-initdb.d/002_workflow_dispatch.sql:ro
      - ./postgres/003_workflow_jobs.sql:/docker-entrypoint-initdb.d/003_workflow_jobs.sql:ro
      - ./postgres/004_github_verified_identity.sql:/docker-entrypoint-initdb.d/004_github_verified_identity.sql:ro
      - ./postgres/005_steam_enrollments.sql:/docker-entrypoint-initdb.d/005_steam_enrollments.sql:ro
      - ./postgres/006_release_authorizations.sql:/docker-entrypoint-initdb.d/006_release_authorizations.sql:ro
      - ./postgres/007_workflow_job_heartbeats.sql:/docker-entrypoint-initdb.d/007_workflow_job_heartbeats.sql:ro
      - ./postgres/008_workflow_control_actions.sql:/docker-entrypoint-initdb.d/008_workflow_control_actions.sql:ro
      - ./postgres/009_workflow_inbox_tenant_key.sql:/docker-entrypoint-initdb.d/009_workflow_inbox_tenant_key.sql:ro
      - ./postgres/010_admin_idempotency.sql:/docker-entrypoint-initdb.d/010_admin_idempotency.sql:ro
      - ./postgres/011_admin_catalog.sql:/docker-entrypoint-initdb.d/011_admin_catalog.sql:ro
      - ./postgres/012_workflow_signal_outbox.sql:/docker-entrypoint-initdb.d/012_workflow_signal_outbox.sql:ro
      - ./postgres/013_runner_workflow_attempts.sql:/docker-entrypoint-initdb.d/013_runner_workflow_attempts.sql:ro
      - ./postgres/014_runner_execution_locks.sql:/docker-entrypoint-initdb.d/014_runner_execution_locks.sql:ro
      - ./postgres/015_runner_ingress_transactions.sql:/docker-entrypoint-initdb.d/015_runner_ingress_transactions.sql:ro
      - ./postgres/016_approved_test_plan_bindings.sql:/docker-entrypoint-initdb.d/016_approved_test_plan_bindings.sql:ro
      - ./postgres/017_runner_toolchain_revisions.sql:/docker-entrypoint-initdb.d/017_runner_toolchain_revisions.sql:ro
      - ./postgres/018_steam_install_grants.sql:/docker-entrypoint-initdb.d/018_steam_install_grants.sql:ro
      - ./postgres/019_steam_publish_claims.sql:/docker-entrypoint-initdb.d/019_steam_publish_claims.sql:ro
      - ./postgres/020_steam_workflow_operations.sql:/docker-entrypoint-initdb.d/020_steam_workflow_operations.sql:ro
      - ./postgres/021_steam_release_execution.sql:/docker-entrypoint-initdb.d/021_steam_release_execution.sql:ro
      - ./postgres/022_steam_workflow_dispatch.sql:/docker-entrypoint-initdb.d/022_steam_workflow_dispatch.sql:ro
      - ./postgres/023_steam_rc_issuance.sql:/docker-entrypoint-initdb.d/023_steam_rc_issuance.sql:ro
      - ./postgres/024_steam_release_preparation.sql:/docker-entrypoint-initdb.d/024_steam_release_preparation.sql:ro
      - ./postgres/025_steam_release_lifecycle.sql:/docker-entrypoint-initdb.d/025_steam_release_lifecycle.sql:ro
      - ./postgres/026_steam_clean_install_reservations.sql:/docker-entrypoint-initdb.d/026_steam_clean_install_reservations.sql:ro
      - ./postgres/027_agent_supply_chain_operations.sql:/docker-entrypoint-initdb.d/027_agent_supply_chain_operations.sql:ro
      - ./postgres/028_inference_gateway.sql:/docker-entrypoint-initdb.d/028_inference_gateway.sql:ro
      - ./postgres/029_inference_request_claims.sql:/docker-entrypoint-initdb.d/029_inference_request_claims.sql:ro
      - ./postgres/030_inference_reconciliation.sql:/docker-entrypoint-initdb.d/030_inference_reconciliation.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deviludo -d deviludo"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [control]

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: deviludo
      POSTGRES_PWD: ${DEVILUDO_POSTGRES_PASSWORD:?set DEVILUDO_POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports: ["127.0.0.1:7233:7233"]
    networks: [control]

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on: [temporal]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports: ["127.0.0.1:8233:8080"]
    networks: [control]

  redis:
    image: redis:7.4.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${DEVILUDO_REDIS_PASSWORD:?set DEVILUDO_REDIS_PASSWORD}"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$DEVILUDO_REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      DEVILUDO_REDIS_PASSWORD: ${DEVILUDO_REDIS_PASSWORD:?set DEVILUDO_REDIS_PASSWORD}
    networks: [control]

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${DEVILUDO_MINIO_USER:?set DEVILUDO_MINIO_USER}
      MINIO_ROOT_PASSWORD: ${DEVILUDO_MINIO_PASSWORD:?set DEVILUDO_MINIO_PASSWORD}
    volumes: ["minio-data:/data"]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [control]

  vault:
    image: hashicorp/vault:1.17.6
    cap_add: [IPC_LOCK]
    command: ["server", "-dev", "-dev-root-token-id=${DEVILUDO_VAULT_DEV_TOKEN:?set DEVILUDO_VAULT_DEV_TOKEN}"]
    environment:
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["127.0.0.1:8200:8200"]
    volumes:
      - ./vault:/vault/policies:ro
    networks: [control]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    networks: [control]

networks:
  control:
    internal: true

volumes:
  postgres-data:
  redis-data:
  minio-data:
