openapi: 3.1.0
info:
  title: DeviLudo Control Plane API
  version: 0.1.0-beta
  description: Production API contract. The local Sites preview exposes the same operations below /api/admin.
servers:
  - url: https://api.deviludo.example
security:
  - bearerAuth: []
paths:
  /auth/github:
    get:
      operationId: beginInvitedGitHubLogin
      security: []
      parameters:
        - name: invite
          in: query
          required: true
          schema: { type: string, format: password, writeOnly: true }
      responses:
        "303": { description: Redirect to the fixed GitHub OAuth authorization endpoint and set the short-lived browser-binding cookie. }
        "400": { description: Invitation is invalid, expired, revoked, claimed, or consumed. }
  /auth/github/callback:
    get:
      operationId: completeInvitedGitHubLogin
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, required: true, schema: { type: string, writeOnly: true } }
      responses:
        "303": { description: Consume the invitation, set the Secure/HttpOnly platform session, and continue to GitHub App repository setup. }
  /auth/session:
    get:
      operationId: getPlatformSession
      security: [{ cookieAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { description: Session is absent, expired, revoked, or suspended. }
    delete:
      operationId: revokePlatformSession
      security: [{ cookieAuth: [] }]
      responses:
        "204": { description: Session was revoked if present and both cookies were cleared. }
  /connections/github:
    get:
      operationId: getGitHubConnectionStatus
      description: Reads the active GitHub App installation projection for the authenticated tenant user from the isolated authorization Broker. OAuth return query parameters are never treated as connection state.
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Authoritative GitHub App connection status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/GitHubConnectionStatus" } }
        "401": { description: A fresh trusted platform session is required. }
        "502": { description: The isolated GitHub authorization Broker is unavailable or returned an invalid projection. }
        "503": { description: The GitHub authorization Broker is not configured. }
    post:
      operationId: beginGitHubAppConnection
      description: Reserves a single-use GitHub App installation authorization bound to the authenticated tenant user and browser session. GitHub passwords and user tokens are never accepted.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "201":
          description: Fixed-origin GitHub App installation URL.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/GitHubAuthorizationStart" } }
        "401": { description: A fresh trusted platform session is required. }
        "503": { description: The GitHub authorization Broker is not configured. }
  /connections/github/setup:
    get:
      operationId: continueGitHubAppSetup
      description: Validates the GitHub App setup callback through the isolated Broker and redirects only to GitHub's fixed OAuth authorization endpoint.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } }
        - { name: installation_id, in: query, required: true, schema: { type: string, pattern: "^[1-9][0-9]{0,19}$" } }
        - { name: setup_action, in: query, required: true, schema: { type: string, enum: [install, update] } }
      responses:
        "303": { description: Redirect to the fixed GitHub OAuth endpoint with PKCE. }
        "400": { description: Callback parameters or state binding are invalid. }
  /connections/github/callback:
    get:
      operationId: completeGitHubAppConnection
      description: Consumes the single-use OAuth code inside the Broker, verifies the numeric GitHub user and installation, and redirects to the connection page. The query flag is informational only.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } }
        - { name: code, in: query, required: true, schema: { type: string, writeOnly: true, maxLength: 512 } }
      responses:
        "303": { description: Installation was verified and persisted under tenant RLS. }
        "400": { description: Callback parameters or state binding are invalid. }
  /connections/steam:
    get:
      operationId: getSteamConnectionStatus
      description: Reads the authenticated user's latest active build-account session or resumable Guard enrollment from the isolated Steam Access Broker. No password, Guard code, config.vdf, or SecretRef is returned.
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Authoritative Steam connection status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/SteamConnectionStatus" } }
        "401": { description: A fresh trusted platform session is required. }
        "502": { description: The isolated Steam Access Broker is unavailable or returned an invalid projection. }
        "503": { description: The isolated Steam Access Broker is not configured. }
    post:
      operationId: beginSteamGuardEnrollment
      description: Creates or resumes a short-lived isolated enrollment. Steam credentials are accepted only by the separately hosted secure UI and never cross the main Web process.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: A still-active build-account session is ready.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/SteamEnrollmentResult" } }
        "202":
          description: Continue credentials or Steam Guard entry in the isolated secure UI.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/SteamEnrollmentResult" } }
        "401": { description: A fresh trusted platform session is required. }
        "503": { description: The isolated Steam Access Broker is not configured. }
  /releases/{releaseId}/accept-and-publish:
    post:
      operationId: acceptAndPublishSteamRelease
      description: Starts isolated AAL2 authorization for the authoritative WAITING_MFA release. Client-provided MFA proofs, commit SHAs, evidence status, and request bodies are rejected.
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ReleaseId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: The exact release authorization has already been signed and dispatched to its Temporal workflow.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/ReleaseAuthorization" } }
        "202":
          description: AAL2 authorization is required in the isolated secure UI.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/ReleaseAuthorization" } }
        "400": { description: A client body or MFA proof header was supplied and rejected. }
        "401": { description: A fresh trusted platform session is required. }
        "503": { description: Release authorization, MFA signer, or authoritative evidence dispatch is not configured. }
  /admin/agents:
    get:
      operationId: listAgents
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /admin/invitations:
    post:
      operationId: issueTenantInvitation
      description: Returns a single-use invitation URL once. It must not be persisted in an idempotency result, browser storage, logs, or audit metadata.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenantId, role, expiresAt]
              properties:
                tenantId: { type: string, format: uuid }
                role: { type: string, enum: [TenantAdmin, ProjectOwner, Auditor] }
                expiresAt: { type: string, format: date-time }
      responses:
        "201": { description: One-time invitation URL; response has no-store and no-referrer controls. }
        "403": { description: Requires signed platform admin authority or a same-tenant TenantAdmin that does not delegate TenantAdmin. }
  /admin/agent-versions/discover:
    post:
      operationId: discoverAgentVersions
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-versions/approve:
    post:
      operationId: approveAgentVersion
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/VersionAction" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-versions/block:
    post:
      operationId: blockAgentVersion
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/VersionAction" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-installations:
    post:
      operationId: createAgentInstallation
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-rollouts/{id}/advance:
    post:
      operationId: advanceAgentRollout
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-rollouts/{id}/rollback:
    post:
      operationId: rollbackAgentRollout
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-profiles:
    post:
      operationId: createAgentProfileRevision
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProfileDraft" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-profiles/{id}/validate:
    post:
      operationId: validateAgentProfile
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-profiles/{id}/activate:
    post:
      operationId: activateAgentProfile
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-profiles/{id}/disable:
    post:
      operationId: disableAgentProfile
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/credentials:
    post:
      operationId: createCredential
      description: Plaintext is accepted once by the Vault ingress and is never returned or stored in business data.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, apiKey]
              properties:
                label: { type: string, maxLength: 120 }
                apiKey: { type: string, format: password, writeOnly: true }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/credentials/{id}/rotate:
    post:
      operationId: rotateCredential
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/credentials/{id}/revoke:
    post:
      operationId: revokeCredential
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-defaults/{scope}:
    put:
      operationId: updateAgentDefault
      parameters:
        - name: scope
          in: path
          required: true
          schema: { type: string, examples: [platform, "tenant:north-dock", "project:ember-archipelago"] }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /admin/agent-health:
    get:
      operationId: getAgentHealth
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /admin/audit:
    get:
      operationId: listAgentAudit
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /admin/inference-requests/{id}/reconcile:
    post:
      operationId: reconcileInferenceRequest
      description: SecurityAdmin-only recovery for one ambiguous upstream inference request. The evidence digest must come from the upstream request/usage record.
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InferenceReconciliation" }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "409": { description: The request is active, terminal, or already reconciled with another outcome. }
  /admin/inference-runs/{tenantId}/{runId}/reconciliation:
    get:
      operationId: getInferenceReconciliation
      description: SecurityAdmin-only read for the unique unresolved request of one tenant run. Expired active leases are presented as effectively indeterminate without a hidden write.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /admin/spec-model-generations/{operationKey}/reconcile:
    post:
      operationId: reconcileSpecModelGeneration
      description: SecurityAdmin-only release of one indeterminate specification-model dispatch. Retrying remains forbidden until an upstream evidence digest confirms no usage or records the exact charged token usage.
      parameters:
        - name: operationKey
          in: path
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpecModelReconciliation" }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "409": { description: The dispatch is active, completed, already released, or reconciled with different evidence. }
  /admin/spec-model-generations/{tenantId}/{operationKey}/reconciliation:
    get:
      operationId: getSpecModelGenerationReconciliation
      description: SecurityAdmin-only lookup of one unresolved specification-model dispatch. Prompt text and model output are never returned.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: operationKey
          in: path
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /projects/repositories:
    get:
      operationId: listAuthorizedProjectRepositories
      description: Lists live repositories for GitHub App installations verified against the signed-in numeric GitHub user. No installation token is returned.
      responses:
        "200":
          description: Current GitHub App repository catalog.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/ProjectRepositoryCatalog" } }
        "401": { description: A fresh trusted platform session is required. }
  /projects:
    get:
      operationId: listRepositoryBoundProjects
      description: Lists at most 500 active projects visible to the signed-in tenant user through project creator authority or a still-active verified GitHub App installation.
      responses:
        "200":
          description: Tenant-isolated project catalog derived by the Project Repository Broker.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 500
                    items: { $ref: "#/components/schemas/RepositoryBoundProject" }
        "401": { description: A fresh trusted platform session is required. }
    post:
      operationId: createRepositoryBoundProject
      description: The server derives owner, repository name, node ID, and default branch from a fresh GitHub response and atomically persists the project and repository binding.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRepositoryBoundProject" }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "409": { description: The slug or repository is already bound, or the idempotency key has another request digest. }
  /projects/{projectId}:
    get:
      operationId: getRepositoryBoundProject
      description: Returns a project only when the signed-in tenant user created it or still controls its verified active GitHub App installation.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { description: The project is missing or inaccessible to the current account. }
  /projects/{projectId}/steam-settings:
    get:
      operationId: getProjectSteamSettings
      description: Revalidates exact GitHub project access, then reads the active immutable Steam release/depot revision and its build-session readiness. Passwords and SecretRefs are never returned.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Authoritative project Steam release configuration projection.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/SteamProjectConfigurationStatus" } }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "503": { description: The isolated Steam Access Broker is not configured. }
    post:
      operationId: beginProjectSteamSettings
      description: Creates a five-minute, user/session/build-account-bound intent. This operation accepts no request body; App, Depot, branch and branch-password fields are accepted only by the separately hosted Steam Secure UI.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201":
          description: Continue release configuration at the fixed-origin isolated Secure UI.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/SteamProjectConfigurationResult" } }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "409": { description: The idempotency key is already bound to another intent. }
        "503": { description: The isolated Steam Access Broker is not configured. }
  /projects/{projectId}/runners:
    get:
      operationId: getProjectRunnerFleet
      description: Revalidates the signed GitHub user's access to the exact project, then returns at most one latest fenced Runner lease per platform. Connectivity is derived from immutable registration state, heartbeat freshness, and certificate expiry; the endpoint has no Runner write authority.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Tenant-isolated project Runner Fleet projection.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/RunnerFleetProjection" } }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "503": { description: The isolated delivery/Runner projection Broker is unavailable. }
  /projects/{projectId}/evidence:
    get:
      operationId: getProjectEvidenceCatalog
      description: Revalidates the signed GitHub user's access to the exact project, then returns the latest 50 immutable evidence manifests after checking canonical bundle digests, authority bindings, platform coverage, and invalidation tombstones. Archive object keys and storage grants are never returned.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Tenant-isolated project Evidence Catalog projection.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/EvidenceCatalogProjection" } }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "503": { description: The isolated evidence projection Broker is unavailable or stored evidence failed verification. }
  /projects/{projectId}/delivery:
    get:
      operationId: getProjectDelivery
      description: Revalidates the signed GitHub user's access to the exact project, then returns the replay-verified Temporal delivery projection. The Web workload has no workflow or database write authority.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is inaccessible or has no production delivery workflow. }
        "503": { description: The project repository or delivery projection Broker is unavailable. }
    post:
      operationId: cancelProjectDelivery
      description: Revalidates exact project access and asks the user-decision Broker to cancel the current replay-verified workflow. Clients cannot submit workflow, Agent, Runner, evidence, or Steam authority.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: { type: string, const: cancel }
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "202": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "409": { description: The authoritative workflow is terminal or has crossed the irreversible publish boundary. }
  /projects/{projectId}/conversation:
    get:
      operationId: getSpecConversation
      description: Revalidates exact project access before reading the immutable specification conversation snapshot.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
    post:
      operationId: sendSpecConversationMessage
      description: Revalidates exact project access and uses the independent low-latency specification service, never the development Agent.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, message]
              properties:
                expectedRevision: { type: integer, minimum: 0 }
                message: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "409": { description: Expected revision changed or the command is in progress. }
  /projects/{projectId}/spec-revisions:
    get:
      operationId: getGameSpecRevision
      description: Revalidates exact project access before reading the current immutable specification and test-plan revision.
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is inaccessible or has not produced a specification revision. }
    post:
      operationId: approveGameSpecRevision
      description: Revalidates exact project access before approving the current immutable draft and its server-selected Runner toolchain.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, revision, conversationId, expectedRevision, specRevisionId, testPlanRevisionId]
              properties:
                action: { type: string, enum: [approve] }
                revision: { type: string, minLength: 1, maxLength: 32 }
                conversationId: { type: string, format: uuid }
                expectedRevision: { type: integer, minimum: 1 }
                specRevisionId: { type: string, format: uuid }
                testPlanRevisionId: { type: string, format: uuid }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "409": { description: The specification approval binding changed concurrently. }
        "503": { description: No compatible immutable Runner toolchain is available; no approval was committed. }
  /projects/{projectId}/feedback:
    post:
      operationId: createFeedbackIteration
      description: Revalidates exact project access before creating the next immutable specification draft and invalidating prior candidate evidence.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [feedback]
              properties: { feedback: { type: string, minLength: 1, maxLength: 4000 } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
  /projects/{projectId}/acceptance:
    post:
      operationId: acceptCandidate
      description: Revalidates exact project access, then resolves the authoritative candidate commit, Draft PR, passed E2E attempt, and non-invalidated evidence; clients cannot supply those bindings.
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "409": { description: No single authoritative candidate is awaiting this user's acceptance. }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    cookieAuth: { type: apiKey, in: cookie, name: __Host-deviludo-session }
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 160 }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$" }
  requestBodies:
    VersionAction:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [id]
            properties: { id: { type: string } }
  responses:
    Ok:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {}
              meta: { type: object, additionalProperties: true }
  schemas:
    GitHubConnectionStatus:
      type: object
      additionalProperties: false
      required: [state, installationCount, accountLogin, repositorySelection, permissions, verifiedAt]
      properties:
        state: { type: string, enum: [CONNECTED, NOT_CONNECTED] }
        installationCount: { type: integer, minimum: 0, maximum: 1000 }
        accountLogin: { type: [string, "null"], maxLength: 100 }
        repositorySelection: { type: [string, "null"], enum: [all, selected, null] }
        permissions: { type: [object, "null"], additionalProperties: { type: string } }
        verifiedAt: { type: [string, "null"], format: date-time }
    GitHubAuthorizationStart:
      type: object
      additionalProperties: false
      required: [authorizeUrl, expiresAt]
      properties:
        authorizeUrl: { type: string, format: uri, pattern: "^https://github\\.com/apps/" }
        expiresAt: { type: string, format: date-time }
    SteamConnectionStatus:
      type: object
      additionalProperties: false
      required: [state, enrollmentId, enrollmentUrl, accountName, allowedAppIds, permissions, verifiedAt, expiresAt]
      properties:
        state: { type: string, enum: [UNCONFIGURED, WAITING_CREDENTIALS, WAITING_STEAM_GUARD, READY] }
        enrollmentId: { type: [string, "null"] }
        enrollmentUrl: { type: [string, "null"], format: uri }
        accountName: { type: [string, "null"], maxLength: 64 }
        allowedAppIds: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, pattern: "^[0-9]{1,20}$" } }
        permissions: { type: array, uniqueItems: true, items: { type: string, enum: [EditAppMetadata, PublishAppChanges] } }
        verifiedAt: { type: [string, "null"], format: date-time }
        expiresAt: { type: [string, "null"], format: date-time }
    SteamEnrollmentResult:
      type: object
      additionalProperties: false
      required: [enrollmentId, state, enrollmentUrl, expiresAt]
      properties:
        enrollmentId: { type: string }
        state: { type: string, enum: [WAITING_CREDENTIALS, WAITING_STEAM_GUARD, READY] }
        enrollmentUrl: { type: [string, "null"], format: uri }
        expiresAt: { type: string, format: date-time }
    SteamProjectConfigurationStatus:
      type: object
      additionalProperties: false
      required: [state, projectId, configurationUrl, intentExpiresAt, revision, steamAppId, betaBranch, platformDepots, accountName, sessionExpiresAt]
      properties:
        state: { type: string, enum: [UNCONFIGURED, CONFIGURING, READY, STALE_SESSION] }
        projectId: { type: string, format: uuid }
        configurationUrl: { type: [string, "null"], format: uri }
        intentExpiresAt: { type: [string, "null"], format: date-time }
        revision: { type: [integer, "null"], minimum: 1 }
        steamAppId: { type: [string, "null"], pattern: "^[1-9][0-9]{0,19}$" }
        betaBranch: { type: [string, "null"], pattern: "^[a-z0-9][a-z0-9_-]{2,39}$" }
        platformDepots:
          type: object
          additionalProperties: false
          minProperties: 0
          maxProperties: 3
          properties:
            windows: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
            linux: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
            macos: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
        accountName: { type: [string, "null"], maxLength: 64 }
        sessionExpiresAt: { type: [string, "null"], format: date-time }
    SteamProjectConfigurationResult:
      type: object
      additionalProperties: false
      required: [intentId, projectId, state, configurationUrl, expiresAt, revision]
      properties:
        intentId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        state: { type: string, enum: [CONFIGURING, READY] }
        configurationUrl: { type: [string, "null"], format: uri }
        expiresAt: { type: string, format: date-time }
        revision: { type: [integer, "null"], minimum: 1 }
    ReleaseAuthorization:
      type: object
      additionalProperties: false
      required: [releaseId, state, approvalId, authorizationUrl, workflowId, expiresAt]
      properties:
        releaseId: { type: string }
        state: { type: string, enum: [MFA_REQUIRED, DISPATCHED] }
        approvalId: { type: string }
        authorizationUrl: { type: [string, "null"], format: uri }
        workflowId: { type: [string, "null"] }
        expiresAt: { type: string, format: date-time }
    EvidenceCatalogProjection:
      type: object
      additionalProperties: false
      required: [schemaVersion, tenantId, projectId, observedAt, entries]
      properties:
        schemaVersion: { const: deviludo.evidence-catalog-projection.v1 }
        tenantId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        observedAt: { type: string, format: date-time }
        entries:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [evidenceBundleId, invalidatedAt, binding, bundle]
            properties:
              evidenceBundleId: { type: string, format: uuid }
              invalidatedAt: { type: [string, "null"], format: date-time }
              binding: { $ref: "#/components/schemas/EvidenceAuthorityBinding" }
              bundle: { $ref: "#/components/schemas/EvidenceBundleManifest" }
    EvidenceAuthorityBinding:
      type: object
      additionalProperties: false
      required: [schemaVersion, attemptId, executionLockId, executionLockDigest, specRevisionId, specDigest, testPlanDigest, runnerToolchainRevisionId, runnerToolchainDigest, commitSha, sourceDigest, targetMatrix]
      properties:
        schemaVersion: { const: deviludo.evidence-binding.v1 }
        attemptId: { type: string, format: uuid }
        executionLockId: { type: string, format: uuid }
        executionLockDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        specRevisionId: { type: string, format: uuid }
        specDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        testPlanDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        runnerToolchainRevisionId: { type: string, format: uuid }
        runnerToolchainDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        commitSha: { type: string, pattern: "^[a-f0-9]{40}$" }
        sourceDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        targetMatrix:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { type: string, enum: [linux, macos, windows] }
    EvidenceBundleManifest:
      type: object
      additionalProperties: false
      required: [id, attemptId, specRevisionId, specDigest, testPlanDigest, commitSha, sourceDigest, targetMatrix, godotTestKitDigest, buildManifestDigest, sbomDigest, vulnerabilityScanDigest, assetLicenseLedgerDigest, platformEvidence, bundleDigest, status, valid, createdAt]
      properties:
        id: { type: string, format: uuid }
        attemptId: { type: string, format: uuid }
        specRevisionId: { type: string, format: uuid }
        specDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        testPlanDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        commitSha: { type: string, pattern: "^[a-f0-9]{40}$" }
        sourceDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        targetMatrix:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { type: string, enum: [linux, macos, windows] }
        godotTestKitDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        buildManifestDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        sbomDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        vulnerabilityScanDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        assetLicenseLedgerDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        platformEvidence:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: "#/components/schemas/PlatformEvidenceManifest" }
        bundleDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        status: { type: string, enum: [PASSED, FAILED] }
        valid: { const: true }
        createdAt: { type: string, format: date-time }
    PlatformEvidenceManifest:
      type: object
      additionalProperties: false
      required: [platform, runnerId, runnerCapabilityDigest, exportDigest, logsDigest, junitDigest, inputTimelineDigest, screenshotManifestDigest, videoManifestDigest, status]
      properties:
        platform: { type: string, enum: [linux, macos, windows] }
        runnerId: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$" }
        runnerCapabilityDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        exportDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        logsDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        junitDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        inputTimelineDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        screenshotManifestDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        videoManifestDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        status: { type: string, enum: [PASSED, FAILED] }
    RunnerFleetProjection:
      type: object
      additionalProperties: false
      required: [schemaVersion, tenantId, projectId, observedAt, runners]
      properties:
        schemaVersion: { const: deviludo.runner-fleet-projection.v1 }
        tenantId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        observedAt: { type: string, format: date-time }
        runners:
          type: array
          maxItems: 3
          items:
            type: object
            additionalProperties: false
            required: [runnerId, platform, architecture, capabilityDigest, registrationState, connectivity, lastSeenAt, certificateNotAfter, attemptId, leaseState, fencingToken, leaseExpiresAt, updatedAt]
            properties:
              runnerId: { type: string, pattern: "^[a-z0-9][a-z0-9-]{2,63}$" }
              platform: { type: string, enum: [linux, macos, windows] }
              architecture: { type: string, enum: [arm64, x86_64] }
              capabilityDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
              registrationState: { type: string, enum: [DRAINING, OFFLINE, ONLINE, QUARANTINED] }
              connectivity: { type: string, enum: [DRAINING, OFFLINE, QUARANTINED, READY, STALE] }
              lastSeenAt: { type: string, format: date-time }
              certificateNotAfter: { type: string, format: date-time }
              attemptId: { type: string, format: uuid }
              leaseState: { type: string, enum: [EXPIRED, FAILED, INVALIDATED, LEASED, PASSED, RUNNING] }
              fencingToken: { type: string, pattern: "^[1-9][0-9]{0,19}$" }
              leaseExpiresAt: { type: string, format: date-time }
              updatedAt: { type: string, format: date-time }
    CreateRepositoryBoundProject:
      type: object
      additionalProperties: false
      required: [slug, name, installationId, repositoryId]
      properties:
        slug: { type: string, pattern: "^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$" }
        name: { type: string, minLength: 1, maxLength: 120 }
        installationId: { type: string, pattern: "^[0-9]{1,20}$" }
        repositoryId: { type: integer, minimum: 1 }
    RepositoryBoundProject:
      type: object
      additionalProperties: false
      required: [projectId, tenantId, slug, name, repositoryBindingId, installationId, repositoryId, repositoryNodeId, owner, repositoryName, defaultBranch, createdAt]
      properties:
        projectId: { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        repositoryBindingId: { type: string, format: uuid }
        installationId: { type: string, pattern: "^[0-9]{1,20}$" }
        repositoryId: { type: integer, minimum: 1 }
        repositoryNodeId: { type: string }
        owner: { type: string }
        repositoryName: { type: string }
        defaultBranch: { type: string }
        createdAt: { type: string, format: date-time }
    ProjectRepositoryCatalog:
      type: object
      additionalProperties: false
      required: [installations]
      properties:
        installations:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [installationId, accountLogin, repositories]
            properties:
              installationId: { type: string, pattern: "^[0-9]{1,20}$" }
              accountLogin: { type: string }
              repositories:
                type: array
                maxItems: 1000
                items:
                  type: object
                  additionalProperties: false
                  required: [installationId, repositoryId, repositoryNodeId, owner, name, defaultBranch, private, archived, disabled]
                  properties:
                    installationId: { type: string, pattern: "^[0-9]{1,20}$" }
                    repositoryId: { type: integer, minimum: 1 }
                    repositoryNodeId: { type: string }
                    owner: { type: string }
                    name: { type: string }
                    defaultBranch: { type: string }
                    private: { type: boolean }
                    archived: { const: false }
                    disabled: { const: false }
    AgentProfileDraft:
      type: object
      required: [agent, baseUrl, primaryModel, credentialId, installationId]
      properties:
        agent: { type: string, enum: [claude-code, codex-cli] }
        baseUrl: { type: string, format: uri }
        primaryModel: { type: string, description: Exact version-bearing model ID; floating aliases are rejected. }
        planningModel: { type: string }
        smallFastModel: { type: string }
        subagentModel: { type: string }
        credentialId: { type: string }
        installationId: { type: string }
        scope: { type: string, enum: [platform, tenant, project] }
        scopeId: { type: string }
        budgetUsd: { type: number, minimum: 0, maximum: 100 }
        fallbackProfileId: { type: [string, "null"], description: Explicit same-Agent fallback only. }
    InferenceReconciliation:
      oneOf:
        - type: object
          additionalProperties: false
          required: [tenantId, runId, action, evidenceDigest]
          properties:
            tenantId: { type: string, format: uuid }
            runId: { type: string, format: uuid }
            action: { const: CONFIRM_NO_USAGE }
            evidenceDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        - type: object
          additionalProperties: false
          required: [tenantId, runId, action, evidenceDigest, inputTokens, outputTokens]
          properties:
            tenantId: { type: string, format: uuid }
            runId: { type: string, format: uuid }
            action: { const: RECORD_USAGE }
            evidenceDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
            inputTokens: { type: integer, minimum: 0 }
            outputTokens: { type: integer, minimum: 0 }
    SpecModelReconciliation:
      oneOf:
        - type: object
          additionalProperties: false
          required: [tenantId, action, evidenceDigest]
          properties:
            tenantId: { type: string, format: uuid }
            action: { const: CONFIRM_NO_USAGE }
            evidenceDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        - type: object
          additionalProperties: false
          required: [tenantId, action, evidenceDigest, inputTokens, outputTokens]
          properties:
            tenantId: { type: string, format: uuid }
            action: { const: RECORD_USAGE }
            evidenceDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
            inputTokens: { type: integer, minimum: 0, maximum: 10000000 }
            outputTokens: { type: integer, minimum: 1, maximum: 10000000 }
