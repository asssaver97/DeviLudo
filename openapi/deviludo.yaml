openapi: 3.1.0
info:
  title: DeviLudo Core API
  version: 1.0.0
paths:
  /health/live:
    get:
      operationId: coreLiveness
      responses:
        "200":
          description: Core process is alive
  /health/ready:
    get:
      operationId: coreReadiness
      responses:
        "200":
          description: Required fixed pools and the database are ready
        "503":
          description: A required pool or the database is unavailable
  /v1/admin/server-pools:
    get:
      operationId: listServerPools
      responses:
        "200":
          description: The five fixed server pools
  /v1/admin/server-nodes:
    get:
      operationId: listServerNodes
      responses:
        "200":
          description: Registered server nodes
    post:
      operationId: createServerNode
      responses:
        "201":
          description: Node registered in a fixed pool
  /v1/session:
    get:
      operationId: readLocalSession
      responses:
        "200":
          description: Current optional workspace selection
  /v1/workspaces:
    get:
      operationId: listWorkspaces
      responses:
        "200":
          description: Workspaces visible to the local operator
    post:
      operationId: createWorkspace
      responses:
        "201":
          description: Workspace created and selected
  /v1/session/workspace:
    put:
      operationId: selectWorkspace
      responses:
        "200":
          description: Workspace selection persisted in an HttpOnly cookie
    delete:
      operationId: clearWorkspace
      responses:
        "200":
          description: Workspace selection cleared
  /v1/projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Projects in the selected workspace
        "409":
          description: A workspace has not been selected
    post:
      operationId: createProject
      responses:
        "201":
          description: Project created; a same-name workspace is also created when none is selected
        "424":
          description: Global Agent configuration is required to generate a missing project name
  /v1/e2e/jobs/claim:
    post:
      operationId: claimE2eJob
      responses:
        "200":
          description: Exclusive platform-matched job lease or no work
