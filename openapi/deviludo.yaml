openapi: 3.1.0
info:
  title: DeviLudo Core API
  version: 6.0.0
components:
  securitySchemes:
    platformSession:
      type: apiKey
      in: cookie
      name: platform_session
      description: Forwarded to Platform for assertion only when DEVILUDO_ACCESS_MODE=platform; standalone has no browser authentication.
    platformInternal:
      type: http
      scheme: bearer
      description: Service credential shared only by Platform and Core.
    e2eMtls:
      type: mutualTLS
  parameters:
    jobId:
      in: path
      name: jobId
      required: true
      schema: { type: string, format: uuid }
paths:
  /health/live:
    get:
      operationId: coreLiveness
      responses:
        "200": { description: Core process is alive }
  /health/ready:
    get:
      operationId: coreReadiness
      responses:
        "200": { description: Required fixed pools, persistent source root, and access-mode dependencies are ready }
        "503": { description: A required fixed pool is unavailable }
  /v1/session:
    get:
      operationId: readSession
      security: [{ platformSession: [] }, {}]
      responses:
        "200": { description: STANDALONE anonymous principal or a fresh Platform account/workspace/role assertion }
        "401": { description: Platform assertion is missing, invalid, or unavailable }
  /v1/settings/agent:
    get:
      operationId: readGlobalAgentSettings
      security: [{ platformSession: [] }, {}]
      responses:
        "200": { description: Masked instance Agent settings and runtime versions }
    put:
      operationId: saveGlobalAgentSettings
      security: [{ platformSession: [] }, {}]
      responses:
        "200": { description: Instance Agent settings stored with a Vault secret reference }
        "403": { description: Instance administrator permission required }
  /v1/projects:
    get:
      operationId: listProjects
      security: [{ platformSession: [] }, {}]
      responses:
        "200": { description: Projects in the asserted workspace, including the latest persistent source revision }
    post:
      operationId: createProject
      security: [{ platformSession: [] }, {}]
      responses:
        "201": { description: Local project created without any repository binding }
        "424": { description: Global Agent configuration or name generation failed }
  /v1/projects/import/archive:
    post:
      operationId: importLocalProjectArchive
      security: [{ platformSession: [] }, {}]
      parameters:
        - in: query
          name: name
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary, maxLength: 67108864 }
      responses:
        "201": { description: Local source snapshot, Agent project document, and initial conversation created }
        "413": { description: Archive exceeds the 64 MiB compressed limit }
        "422": { description: Archive or source boundary is invalid }
        "424": { description: Global Agent configuration or project analysis failed }
  /v1/projects/{projectId}/approve:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: approveProjectSpecification
      security: [{ platformSession: [] }, {}]
      responses:
        "202": { description: Immutable specification object registered and workflow started }
  /v1/projects/{projectId}/retry-agent:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
      - in: header
        name: Idempotency-Key
        schema: { type: string, minLength: 8, maxLength: 300 }
    post:
      operationId: retryFailedAgentGeneration
      security: [{ platformSession: [] }, {}]
      responses:
        "202": { description: A new Agent job was created with the currently verified runtime image }
        "200": { description: The same retry request was already accepted }
        "409": { description: The current workflow did not fail during Agent generation }
        "424": { description: Global Agent configuration is unavailable }
  /v1/projects/{projectId}/retry-artifact-build:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
      - in: header
        name: Idempotency-Key
        required: false
        schema: { type: string, minLength: 8, maxLength: 300 }
    post:
      operationId: retryFailedArtifactBuild
      security: [{ platformSession: [] }, {}]
      responses:
        "202": { description: A new build job was created from the latest verified Agent source }
        "200": { description: The same retry request was already accepted }
        "409": { description: The current workflow did not fail during artifact build }
  /v1/projects/{projectId}/retry-e2e:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
      - in: header
        name: Idempotency-Key
        required: false
        schema: { type: string, minLength: 8, maxLength: 300 }
    post:
      operationId: retryFailedE2e
      security: [{ platformSession: [] }, {}]
      responses:
        "202": { description: New E2E jobs were created for target platforms without a successful test }
        "200": { description: The same retry request was already accepted }
        "409": { description: The current workflow did not fail during E2E }
  /v1/projects/{projectId}:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: readProject
      security: [{ platformSession: [] }, {}]
      responses:
        "200": { description: Project, current collaborative document, revision history, and workflow state }
        "404": { description: Project is not visible in the selected workspace }
    delete:
      operationId: deleteProject
      security: [{ platformSession: [] }, {}]
      responses:
        "204": { description: Project database rows, object artifacts, and its exact persistent source directory were deleted }
        "403": { description: Workspace owner or admin permission required }
        "409": { description: An active delivery must be cancelled before deletion }
  /v1/projects/{projectId}/artifacts:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listProjectArtifacts
      security: [{ platformSession: [] }, {}]
      responses:
        "200": { description: Build, E2E report, signature, and publication artifacts; source remains in persistent revisions }
        "404": { description: Project is not visible in the selected workspace }
  /v1/projects/{projectId}/artifacts/{artifactId}/download:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: artifactId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: authorizeProjectArtifactDownload
      security: [{ platformSession: [] }, {}]
      responses:
        "200": { description: A workspace-scoped download URL valid for 120 seconds }
        "404": { description: Artifact is not visible in the selected workspace and project }
  /v1/projects/{projectId}/conversations:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listProjectConversations
      security: [{ platformSession: [] }, {}]
      responses:
        "200": { description: Most recently active project conversations with previews and message counts }
        "404": { description: Project is not visible in the selected workspace }
  /v1/projects/{projectId}/agent-progress/stream:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
      - in: query
        name: after
        schema: { type: integer, minimum: 0, default: 0 }
    get:
      operationId: streamAgentGenerationProgress
      security: [{ platformSession: [] }, {}]
      responses:
        "200":
          description: Newline-delimited Agent phases, visible output, accepted player guidance, and completion state
          content:
            application/x-ndjson:
              schema: { type: string }
        "404": { description: Project is not visible in the selected workspace }
  /v1/projects/{projectId}/document:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateProjectDocument
      security: [{ platformSession: [] }, {}]
      responses:
        "200": { description: Collaborative project document updated with a new immutable revision }
        "409": { description: Expected revision is stale }
  /v1/conversations/{conversationId}:
    parameters:
      - in: path
        name: conversationId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: readConversation
      security: [{ platformSession: [] }, {}]
      responses:
        "200": { description: Conversation messages in chronological order }
        "404": { description: Conversation is not visible in the selected workspace }
  /v1/conversations/messages:
    post:
      operationId: sendConversationMessage
      security: [{ platformSession: [] }, {}]
      responses:
        "200": { description: Existing conversation updated }
        "201": { description: Project conversation created }
        "424": { description: Global Agent configuration or provider call failed }
  /v1/conversations/messages/stream:
    post:
      operationId: streamConversationMessage
      security: [{ platformSession: [] }, {}]
      responses:
        "200":
          description: Newline-delimited design reply and persisted result; during Agent generation the user message is stored as live task guidance
          content:
            application/x-ndjson:
              schema: { type: string }
  /v1/admin/server-pools:
    get:
      operationId: listServerPools
      security: [{ platformSession: [] }, {}]
      responses:
        "200": { description: The five fixed server pools }
        "403": { description: Instance administrator permission required }
  /v1/admin/server-nodes:
    get:
      operationId: listServerNodes
      security: [{ platformSession: [] }, {}]
      responses:
        "200": { description: Registered server nodes }
    post:
      operationId: createServerNode
      security: [{ platformSession: [] }, {}]
      responses:
        "201": { description: Node registered in a fixed pool }
  /v1/admin/e2e-enrollment-tokens:
    post:
      operationId: createE2eEnrollmentToken
      security: [{ platformSession: [] }, {}]
      responses:
        "201": { description: Single-use 30-minute E2E enrollment token created }
  /v1/internal/platform/source-events:
    get:
      operationId: pullPlatformSourceReadyEvents
      security: [{ platformInternal: [] }]
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        "200": { description: Unacknowledged project.source.ready events ordered for replay }
        "401": { description: Platform service credential is invalid }
  /v1/internal/platform/source-events/ack:
    post:
      operationId: acknowledgePlatformSourceReadyEvents
      security: [{ platformInternal: [] }]
      responses:
        "200": { description: Events atomically acknowledged after Platform persisted scheduling state }
  /v1/internal/platform/projects/import:
    post:
      operationId: importPlatformRepositoryArchive
      security: [{ platformInternal: [] }]
      requestBody:
        required: true
        content:
          application/zip:
            schema: { type: string, format: binary, maxLength: 67108864 }
      responses:
        "201": { description: Platform-authenticated archive imported into a new persistent Core project directory }
        "422": { description: Archive violates the source boundary }
  /v1/internal/platform/workspaces/{workspaceId}/projects/{projectId}:
    parameters:
      - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: projectId, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: readPlatformProjectBoundary
      security: [{ platformInternal: [] }]
      responses:
        "200": { description: Project identity and latest source revision for Platform repository operations }
        "404": { description: Project does not exist in the requested workspace }
    delete:
      operationId: deletePlatformProject
      security: [{ platformInternal: [] }]
      responses:
        "204": { description: Active tasks stopped and all Core project data, object artifacts, and source directories deleted }
        "404": { description: Project does not exist in the requested workspace }
  /v1/internal/platform/workspaces/{workspaceId}/projects/{projectId}/source/{revision}/archive:
    parameters:
      - { in: path, name: workspaceId, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: projectId, required: true, schema: { type: string, format: uuid } }
      - { in: path, name: revision, required: true, schema: { type: integer, minimum: 1 } }
    get:
      operationId: downloadDeterministicSourceRevisionArchive
      security: [{ platformInternal: [] }]
      responses:
        "200": { description: Deterministic tar.gz plus digest, file-count, and byte-count headers }
        "404": { description: Source revision does not exist }
        "409": { description: Persistent source content does not match its database receipt }
  /v1/e2e/enroll:
    post:
      operationId: enrollE2eNode
      responses:
        "201": { description: Node registered and SPIFFE client certificate issued }
  /v1/e2e/nodes/{nodeId}/renew:
    parameters:
      - in: path
        name: nodeId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: renewE2eNodeCertificate
      security: [{ e2eMtls: [] }]
      responses:
        "200": { description: A replacement short-lived certificate was issued }
  /v1/e2e/jobs/claim:
    post:
      operationId: claimE2eJob
      security: [{ e2eMtls: [] }]
      responses:
        "200": { description: Exclusive platform-matched job lease or no work }
  /v1/e2e/jobs/{jobId}/heartbeat:
    parameters: [{ $ref: "#/components/parameters/jobId" }]
    post:
      operationId: heartbeatE2eJob
      security: [{ e2eMtls: [] }]
      responses:
        "200": { description: Lease extended when fencing identity matches }
  /v1/e2e/jobs/{jobId}/complete:
    parameters: [{ $ref: "#/components/parameters/jobId" }]
    post:
      operationId: completeE2eJob
      security: [{ e2eMtls: [] }]
      responses:
        "200": { description: Signed receipt and isolation proofs accepted }
  /v1/e2e/jobs/{jobId}/fail:
    parameters: [{ $ref: "#/components/parameters/jobId" }]
    post:
      operationId: failE2eJob
      security: [{ e2eMtls: [] }]
      responses:
        "200": { description: Failure recorded when fencing identity matches }
  /v1/e2e/jobs/{jobId}/signing-grant:
    parameters: [{ $ref: "#/components/parameters/jobId" }]
    post:
      operationId: issueE2eSigningGrant
      security: [{ e2eMtls: [] }]
      responses:
        "200": { description: Short-lived platform-matched signing grant issued after reimage proof }
  /v1/e2e/jobs/{jobId}/objects:
    parameters: [{ $ref: "#/components/parameters/jobId" }]
    post:
      operationId: authorizeE2eJobInputs
      security: [{ e2eMtls: [] }]
      responses:
        "200": { description: Short-lived job/workspace/digest-bound download URLs }
  /v1/e2e/jobs/{jobId}/outputs:
    parameters: [{ $ref: "#/components/parameters/jobId" }]
    post:
      operationId: authorizeE2eJobOutput
      security: [{ e2eMtls: [] }]
      responses:
        "200": { description: Short-lived job/workspace/digest-bound upload URL }
