openapi: 3.1.0
info:
  title: DeviLudo Core API
  version: 8.0.0
components:
  securitySchemes:
    e2eMtls:
      type: mutualTLS
  parameters:
    jobId:
      in: path
      name: jobId
      required: true
      schema: { type: string, format: uuid }
paths:
  /health/live:
    get:
      operationId: coreLiveness
      responses:
        "200": { description: Core process is alive }
  /health/ready:
    get:
      operationId: coreReadiness
      responses:
        "200": { description: Required fixed pools and the persistent source root are ready }
        "503": { description: A required fixed pool is unavailable }
  /v1/instance:
    get:
      operationId: readLocalInstance
      responses:
        "200": { description: Self-hosted instance and its internal local workspace }
  /v1/settings/telemetry:
    get:
      operationId: readTelemetrySettings
      responses:
        "200": { description: Privacy-minimal active-installation telemetry settings }
    put:
      operationId: saveTelemetrySettings
      responses:
        "200": { description: Anonymous telemetry enabled state persisted locally }
  /v1/settings/agent:
    get:
      operationId: readGlobalAgentSettings
      responses:
        "200": { description: Selected Agent connection, role models, optional single image model, and runtime availability }
    put:
      operationId: saveGlobalAgentSettings
      responses:
        "200": { description: Selected Agent connection and models stored with one protected credential reference; Codex uses official host login }
  /v1/settings/steam:
    get:
      operationId: readWorkspaceSteamSettings
      responses:
        "200": { description: Masked workspace SteamPipe build credential }
    put:
      operationId: saveWorkspaceSteamSettings
      responses:
        "200": { description: Workspace Steam credential stored as a versioned secret reference }
  /v1/projects:
    get:
      operationId: listProjects
      responses:
        "200": { description: Projects in the asserted workspace, including the latest persistent source revision }
    post:
      operationId: createProject
      responses:
        "201": { description: Local project created without any repository binding }
        "424": { description: Global Agent configuration or name generation failed }
  /v1/projects/bind/local-directory:
    post:
      operationId: bindLocalProjectDirectory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bindingId]
              properties:
                name: { type: string, maxLength: 200 }
                bindingId: { type: string, format: uuid }
                gitBranch: { type: string, maxLength: 200 }
      responses:
        "202": { description: Directory linked and project created; durable source analysis continues asynchronously }
        "400": { description: Directory binding or project name is invalid }
  /v1/projects/bind/github:
    post:
      operationId: bindClonedGitHubProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repositoryUrl, bindingId]
              properties:
                name: { type: string, maxLength: 200 }
                repositoryUrl: { type: string }
                bindingId: { type: string, format: uuid }
                gitBranch: { type: string, maxLength: 200 }
      responses:
        "202": { description: Host-cloned working tree linked and project created; durable source analysis continues asynchronously }
        "400": { description: Repository metadata, directory binding, or project name is invalid }
  /v1/projects/{projectId}/analysis/retry:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: retryProjectImportAnalysis
      responses:
        "202": { description: Failed initial analysis returned to the durable background queue }
        "409": { description: Initial analysis has not failed }
  /v1/projects/{projectId}/iterations:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listProjectIterations
      responses:
        "200": { description: All immutable delivery iterations, newest first }
        "404": { description: Project is not visible in the selected workspace }
    post:
      operationId: createProjectIteration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseWorkflowId]
              properties:
                baseWorkflowId: { type: string, format: uuid }
      responses:
        "201": { description: New draft iteration created from the latest terminal workflow }
        "200": { description: The child iteration already exists and is returned idempotently }
        "409": { description: Base workflow is stale, non-terminal, or belongs to another project }
  /v1/projects/{projectId}/iterations/{workflowId}:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: workflowId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: readProjectIteration
      responses:
        "200": { description: Read-only iteration state, jobs, events, artifacts, and E2E evidence }
        "404": { description: Workflow is not an iteration of the selected project }
  /v1/projects/{projectId}/approve:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: approveProjectSpecification
      responses:
        "202": { description: Immutable specification object registered and workflow started }
  /v1/projects/{projectId}/steam-settings:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: readProjectSteamSettings
      responses:
        "200": { description: Project App ID, depot mapping, and test branch }
    put:
      operationId: saveProjectSteamSettings
      responses:
        "200": { description: Project SteamPipe settings saved }
        "403": { description: Workspace owner or admin permission required }
  /v1/projects/{projectId}/steam-releases:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listProjectSteamReleases
      responses:
        "200": { description: Persistent release history across project iterations }
    post:
      operationId: createProjectSteamRelease
      responses:
        "202": { description: Versioned release created and SteamPipe upload queued }
        "200": { description: The iteration's existing release was returned idempotently }
        "409": { description: Latest iteration has not reached the release decision gate }
  /v1/projects/{projectId}/iterations/{workflowId}/complete:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: workflowId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: completeIterationWithoutPublishing
      responses:
        "202": { description: E2E-passed iteration completed without a Steam release }
        "409": { description: Iteration is not awaiting a release decision }
  /v1/projects/{projectId}/steam-releases/{releaseId}/confirm-live:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: releaseId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: confirmDefaultSteamReleaseLive
      responses:
        "200": { description: Manual default-branch promotion recorded }
        "409": { description: Release is not awaiting default-branch promotion }
  /v1/projects/{projectId}/retry-agent:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
      - in: header
        name: Idempotency-Key
        schema: { type: string, minLength: 8, maxLength: 300 }
    post:
      operationId: retryFailedAgentGeneration
      responses:
        "202": { description: A new Agent job was created with the currently verified runtime image }
        "200": { description: The same retry request was already accepted }
        "409": { description: The current workflow did not fail during Agent generation }
        "424": { description: Global Agent configuration is unavailable }
  /v1/projects/{projectId}/retry-artifact-build:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
      - in: header
        name: Idempotency-Key
        required: false
        schema: { type: string, minLength: 8, maxLength: 300 }
    post:
      operationId: retryFailedArtifactBuild
      responses:
        "202": { description: A new build job was created from the latest verified Agent source }
        "200": { description: The same retry request was already accepted }
        "409": { description: The current workflow did not fail during artifact build }
  /v1/projects/{projectId}/retry-e2e:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
      - in: header
        name: Idempotency-Key
        required: false
        schema: { type: string, minLength: 8, maxLength: 300 }
    post:
      operationId: retryFailedE2e
      responses:
        "202": { description: New E2E jobs were created for target platforms without a successful test }
        "200": { description: The same retry request was already accepted }
        "409": { description: The current workflow did not fail during E2E }
  /v1/projects/{projectId}:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: readProject
      responses:
        "200": { description: Project, current collaborative document, revision history, and workflow state }
        "404": { description: Project is not visible in the selected workspace }
    delete:
      operationId: deleteProject
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                deleteLocalDirectory:
                  type: boolean
                  default: false
                  description: Permanently delete the server-bound local project directory as part of project deletion; arbitrary client paths are never accepted.
      responses:
        "204": { description: Project database rows, object artifacts, and Core source snapshots were deleted; the bound local directory was also deleted only when explicitly requested }
        "400": { description: The delete-local-directory option is invalid }
        "403": { description: Workspace owner or admin permission required }
        "409": { description: The requested project has no local binding or local directory deletion is unavailable }
        "502": { description: The local directory bridge could not safely complete deletion; the Core project record is retained }
  /v1/projects/{projectId}/artifacts:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listProjectArtifacts
      responses:
        "200": { description: Current iteration build, E2E report, signature, and publication artifacts; source remains in persistent revisions }
        "404": { description: Project is not visible in the selected workspace }
  /v1/projects/{projectId}/artifacts/{artifactId}/download:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: artifactId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: authorizeProjectArtifactDownload
      responses:
        "200": { description: A workspace-scoped download URL valid for 120 seconds }
        "404": { description: Artifact is not visible in the selected workspace and project }
  /v1/projects/{projectId}/conversations:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listProjectConversations
      responses:
        "200": { description: Most recently active project conversations with previews, total and user-message counts, and a system-generated import-analysis marker }
        "404": { description: Project is not visible in the selected workspace }
  /v1/projects/{projectId}/agent-progress/stream:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
      - in: query
        name: after
        schema: { type: integer, minimum: 0, default: 0 }
    get:
      operationId: streamAgentGenerationProgress
      responses:
        "200":
          description: Newline-delimited Agent phases, visible output, accepted player guidance, and completion state
          content:
            application/x-ndjson:
              schema: { type: string }
        "404": { description: Project is not visible in the selected workspace }
  /v1/projects/{projectId}/document:
    parameters:
      - in: path
        name: projectId
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateProjectDocument
      responses:
        "200": { description: Collaborative project document updated with a new immutable revision }
        "409": { description: Expected revision is stale }
  /v1/conversations/{conversationId}:
    parameters:
      - in: path
        name: conversationId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: readConversation
      responses:
        "200": { description: Group-chat messages in chronological order; assistant metadata identifies DESIGN, DEVELOPMENT, or TEST }
        "404": { description: Conversation is not visible in the selected workspace }
  /v1/conversations/messages:
    post:
      operationId: sendConversationMessage
      responses:
        "200": { description: Existing conversation updated }
        "201": { description: Project conversation created }
        "424": { description: Global Agent configuration or provider call failed }
  /v1/conversations/messages/stream:
    post:
      operationId: streamConversationMessage
      responses:
        "200":
          description: Newline-delimited agent_delta events for design, development, and test replies followed by the atomically persisted group-chat result; during Agent generation the user message is stored as live task guidance
          content:
            application/x-ndjson:
              schema: { type: string }
  /v1/runtime/server-pools:
    get:
      operationId: listServerPools
      responses:
        "200": { description: The five fixed server pools }
  /v1/runtime/server-nodes:
    get:
      operationId: listServerNodes
      responses:
        "200": { description: Registered server nodes }
    post:
      operationId: createServerNode
      responses:
        "201": { description: Node registered in a fixed pool }
  /v1/runtime/e2e-enrollment-tokens:
    post:
      operationId: createE2eEnrollmentToken
      responses:
        "201": { description: Single-use 30-minute E2E enrollment token created }
  /v1/e2e/enroll:
    post:
      operationId: enrollE2eNode
      responses:
        "201": { description: Node registered and SPIFFE client certificate issued }
  /v1/e2e/nodes/{nodeId}/renew:
    parameters:
      - in: path
        name: nodeId
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: renewE2eNodeCertificate
      security: [{ e2eMtls: [] }]
      responses:
        "200": { description: A replacement short-lived certificate was issued }
  /v1/e2e/jobs/claim:
    post:
      operationId: claimE2eJob
      security: [{ e2eMtls: [] }]
      responses:
        "200": { description: Exclusive platform-matched job lease or no work }
  /v1/e2e/jobs/{jobId}/heartbeat:
    parameters: [{ $ref: "#/components/parameters/jobId" }]
    post:
      operationId: heartbeatE2eJob
      security: [{ e2eMtls: [] }]
      responses:
        "200": { description: Lease extended when fencing identity matches }
  /v1/e2e/jobs/{jobId}/complete:
    parameters: [{ $ref: "#/components/parameters/jobId" }]
    post:
      operationId: completeE2eJob
      security: [{ e2eMtls: [] }]
      responses:
        "200": { description: Signed receipt and isolation proofs accepted }
  /v1/e2e/jobs/{jobId}/fail:
    parameters: [{ $ref: "#/components/parameters/jobId" }]
    post:
      operationId: failE2eJob
      security: [{ e2eMtls: [] }]
      responses:
        "200": { description: Failure recorded when fencing identity matches }
  /v1/e2e/jobs/{jobId}/objects:
    parameters: [{ $ref: "#/components/parameters/jobId" }]
    post:
      operationId: authorizeE2eJobInputs
      security: [{ e2eMtls: [] }]
      responses:
        "200": { description: Short-lived job/workspace/digest-bound download URLs }
  /v1/e2e/jobs/{jobId}/outputs:
    parameters: [{ $ref: "#/components/parameters/jobId" }]
    post:
      operationId: authorizeE2eJobOutput
      security: [{ e2eMtls: [] }]
      responses:
        "200": { description: Short-lived job/workspace/digest-bound upload URL }
