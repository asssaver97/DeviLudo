openapi: 3.1.0
info:
  title: DeviLudo Control Plane API
  version: 0.1.0-beta
  description: Production API contract. The local Sites preview exposes the browser and administrator operations below /api; localhost-only fixture execution routes are intentionally omitted.
servers:
  - url: https://api.deviludo.example
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getControlPlaneReadiness
      description: Reports production Web readiness without returning credentials, connector URLs, or internal authority material.
      security: []
      responses:
        "200":
          description: Every production Web dependency is configured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlPlaneReadiness" }
        "503":
          description: One or more required production Web dependencies are unavailable or unconfigured.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ControlPlaneReadiness" }
  /auth/github:
    get:
      operationId: beginInvitedGitHubLogin
      security: []
      parameters:
        - name: invite
          in: query
          required: true
          schema: { type: string, format: password, writeOnly: true }
      responses:
        "303": { description: Redirect to the fixed GitHub OAuth authorization endpoint and set the short-lived browser-binding cookie. }
        "400": { description: Invitation is invalid, expired, revoked, claimed, or consumed. }
  /auth/github/callback:
    get:
      operationId: completeInvitedGitHubLogin
      security: []
      parameters:
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code, in: query, required: true, schema: { type: string, writeOnly: true } }
      responses:
        "303": { description: Consume the invitation, set the Secure/HttpOnly platform session, and continue to GitHub App repository setup. }
  /auth/session:
    get:
      operationId: getPlatformSession
      security: [{ cookieAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { description: Session is absent, expired, revoked, or suspended. }
    delete:
      operationId: revokePlatformSession
      security: [{ cookieAuth: [] }]
      responses:
        "204": { description: Session was revoked if present and both cookies were cleared. }
  /connections/github:
    get:
      operationId: getGitHubConnectionStatus
      description: Reads the active GitHub App installation projection for the authenticated tenant user from the isolated authorization Broker. OAuth return query parameters are never treated as connection state.
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Authoritative GitHub App connection status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/GitHubConnectionStatus" } }
        "401": { description: A fresh trusted platform session is required. }
        "502": { description: The isolated GitHub authorization Broker is unavailable or returned an invalid projection. }
        "503": { description: The GitHub authorization Broker is not configured. }
    post:
      operationId: beginGitHubAppConnection
      description: Reserves a single-use GitHub App installation authorization bound to the authenticated tenant user and browser session. GitHub passwords and user tokens are never accepted.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "201":
          description: Fixed-origin GitHub App installation URL.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/GitHubAuthorizationStart" } }
        "401": { description: A fresh trusted platform session is required. }
        "503": { description: The GitHub authorization Broker is not configured. }
  /connections/github/setup:
    get:
      operationId: continueGitHubAppSetup
      description: Validates the GitHub App setup callback through the isolated Broker and redirects only to GitHub's fixed OAuth authorization endpoint.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } }
        - { name: installation_id, in: query, required: true, schema: { type: string, pattern: "^[1-9][0-9]{0,19}$" } }
        - { name: setup_action, in: query, required: true, schema: { type: string, enum: [install, update] } }
      responses:
        "303": { description: Redirect to the fixed GitHub OAuth endpoint with PKCE. }
        "400": { description: Callback parameters or state binding are invalid. }
  /connections/github/callback:
    get:
      operationId: completeGitHubAppConnection
      description: Consumes the single-use OAuth code inside the Broker, verifies the numeric GitHub user and installation, and redirects to the connection page. The query flag is informational only.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: state, in: query, required: true, schema: { type: string, pattern: "^[A-Za-z0-9_-]{43}$" } }
        - { name: code, in: query, required: true, schema: { type: string, writeOnly: true, maxLength: 512 } }
      responses:
        "303": { description: Installation was verified and persisted under tenant RLS. }
        "400": { description: Callback parameters or state binding are invalid. }
  /connections/steam:
    get:
      operationId: getSteamConnectionStatus
      description: Reads the authenticated user's latest active build-account session or resumable Guard enrollment from the isolated Steam Access Broker. No password, Guard code, config.vdf, or SecretRef is returned.
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Authoritative Steam connection status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/SteamConnectionStatus" } }
        "401": { description: A fresh trusted platform session is required. }
        "502": { description: The isolated Steam Access Broker is unavailable or returned an invalid projection. }
        "503": { description: The isolated Steam Access Broker is not configured. }
    post:
      operationId: beginSteamGuardEnrollment
      description: Creates or resumes a short-lived isolated enrollment. Steam credentials are accepted only by the separately hosted secure UI and never cross the main Web process.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      responses:
        "200":
          description: A still-active build-account session is ready.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/SteamEnrollmentResult" } }
        "202":
          description: Continue credentials or Steam Guard entry in the isolated secure UI.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/SteamEnrollmentResult" } }
        "401": { description: A fresh trusted platform session is required. }
        "503": { description: The isolated Steam Access Broker is not configured. }
  /releases/{releaseId}/accept-and-publish:
    post:
      operationId: acceptAndPublishSteamRelease
      description: Starts isolated AAL2 authorization for the authoritative WAITING_MFA release. Client-provided MFA proofs, commit SHAs, evidence status, and request bodies are rejected.
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ReleaseId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: The exact release authorization has already been signed and dispatched to its Temporal workflow.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/ReleaseAuthorization" } }
        "202":
          description: AAL2 authorization is required in the isolated secure UI.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/ReleaseAuthorization" } }
        "400": { description: A client body or MFA proof header was supplied and rejected. }
        "401": { description: A fresh trusted platform session is required. }
        "503": { description: Release authorization, MFA signer, or authoritative evidence dispatch is not configured. }
  /admin/agents:
    get:
      operationId: listAgents
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /admin/invitations:
    post:
      operationId: issueTenantInvitation
      description: Returns a single-use invitation URL once. It must not be persisted in an idempotency result, browser storage, logs, or audit metadata.
      security: [{ bearerAuth: [] }, { cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenantId, role, expiresAt]
              properties:
                tenantId: { type: string, format: uuid }
                role: { type: string, enum: [TenantAdmin, ProjectOwner, Auditor] }
                expiresAt: { type: string, format: date-time }
      responses:
        "201": { description: One-time invitation URL; response has no-store and no-referrer controls. }
        "403": { description: Requires signed platform admin authority or a same-tenant TenantAdmin that does not delegate TenantAdmin. }
  /admin/agent-versions/discover:
    post:
      operationId: discoverAgentVersions
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentVersionDiscovery" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-versions/approve:
    post:
      operationId: approveAgentVersion
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/VersionAction" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-versions/block:
    post:
      operationId: blockAgentVersion
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/VersionAction" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-versions/deprecate:
    post:
      operationId: deprecateAgentVersion
      description: Stops new WorkerImage builds from an approved exact version without interrupting existing installations or pinned runs.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { $ref: "#/components/requestBodies/VersionAction" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-installations:
    post:
      operationId: createAgentInstallation
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentInstallationDraft" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-rollouts/{id}/advance:
    post:
      operationId: advanceAgentRollout
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyObject" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-rollouts/{id}/rollback:
    post:
      operationId: rollbackAgentRollout
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyObject" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-installations/{id}/drain:
    post:
      operationId: drainAgentInstallation
      description: Stops assigning new tasks while immutable in-flight AgentRun bindings continue on the pinned image.
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyObject" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-installations/{id}/retire:
    post:
      operationId: retireAgentInstallation
      description: Retires a drained installation only after the control plane proves that no non-terminal AgentRun remains pinned to it.
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyObject" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-profiles:
    post:
      operationId: createAgentProfileRevision
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProfileDraft" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-profiles/{id}/validate:
    post:
      operationId: validateAgentProfile
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyObject" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-profiles/{id}/activate:
    post:
      operationId: activateAgentProfile
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyObject" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-profiles/{id}/disable:
    post:
      operationId: disableAgentProfile
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyObject" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/credentials:
    post:
      operationId: createCredential
      description: Plaintext is accepted once by the Vault ingress and is never returned or stored in business data.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialDraft" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/credentials/{id}/rotate:
    post:
      operationId: rotateCredential
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialRotation" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/credentials/{id}/revoke:
    post:
      operationId: revokeCredential
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyObject" }
      responses: { "201": { $ref: "#/components/responses/Ok" } }
  /admin/agent-defaults/{scope}:
    put:
      operationId: updateAgentDefault
      parameters:
        - name: scope
          in: path
          required: true
          schema: { type: string, examples: [platform, "tenant:north-dock", "project:ember-archipelago"] }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProfileSelection" }
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /admin/agent-health:
    get:
      operationId: getAgentHealth
      description: Returns role-scoped Agent health, append-only 24-hour inference usage, configuration before/after differences, and actionable alerts. A database role that cannot prove the requested usage scope reports telemetry unavailable rather than a partial aggregate.
      responses: { "200": { $ref: "#/components/responses/AgentHealth" } }
  /admin/audit:
    get:
      operationId: listAgentAudit
      responses: { "200": { $ref: "#/components/responses/Ok" } }
  /admin/inference-requests/{id}/reconcile:
    post:
      operationId: reconcileInferenceRequest
      description: SecurityAdmin-only recovery for one ambiguous upstream inference request. The evidence digest must come from the upstream request/usage record.
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InferenceReconciliation" }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "409": { description: The request is active, terminal, or already reconciled with another outcome. }
  /admin/inference-runs/{tenantId}/{runId}/reconciliation:
    get:
      operationId: getInferenceReconciliation
      description: SecurityAdmin-only read for the unique unresolved request of one tenant run. Expired active leases are presented as effectively indeterminate without a hidden write.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: runId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /admin/spec-model-generations/{operationKey}/reconcile:
    post:
      operationId: reconcileSpecModelGeneration
      description: SecurityAdmin-only release of one indeterminate specification-model dispatch. Retrying remains forbidden until an upstream evidence digest confirms no usage or records the exact charged token usage.
      parameters:
        - name: operationKey
          in: path
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpecModelReconciliation" }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "409": { description: The dispatch is active, completed, already released, or reconciled with different evidence. }
  /admin/spec-model-generations/{tenantId}/{operationKey}/reconciliation:
    get:
      operationId: getSpecModelGenerationReconciliation
      description: SecurityAdmin-only lookup of one unresolved specification-model dispatch. Prompt text and model output are never returned.
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: operationKey
          in: path
          required: true
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /settings/agents:
    get:
      operationId: getTenantAgentSettings
      description: Returns only the Agent catalog, installations, immutable Profiles, masked credentials, and defaults visible to the authenticated tenant. TenantAdmin and Auditor sessions are accepted; plaintext credentials and SecretRefs are never returned.
      security: [{ cookieAuth: [] }]
      responses:
        "200": { $ref: "#/components/responses/AgentSettings" }
        "401": { description: A fresh trusted platform session is required. }
        "403": { description: The signed-in account is not a TenantAdmin or Auditor. }
        "502": { description: The isolated Agent control plane is unavailable. }
        "503": { description: The isolated Agent control plane is not configured. }
  /settings/agents/credentials:
    post:
      operationId: createTenantAgentCredential
      description: Writes one tenant-scoped BYOK credential through the Vault ingress. The plaintext API key is accepted once, cleared by the control plane, and never returned.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialDraft" }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "400": { description: The credential label or plaintext is invalid. }
        "401": { description: A fresh trusted platform session is required. }
        "403": { description: Requires TenantAdmin authority. }
        "502": { description: The isolated Agent control plane or Vault ingress is unavailable. }
        "503": { description: The isolated Agent control plane is not configured. }
  /settings/agents/credentials/{id}/rotate:
    post:
      operationId: rotateTenantAgentCredential
      description: Creates a new immutable tenant credential version, probes every affected Provider successor, and atomically moves tenant defaults only after validation. The previous version stops receiving new leases.
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialRotation" }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "400": { description: The replacement credential is invalid or contains unexpected fields. }
        "401": { description: A fresh trusted platform session is required. }
        "403": { description: Requires TenantAdmin authority over this credential family. }
        "404": { description: The credential version is not visible to this tenant. }
        "409": { description: The version is inactive, reused, or another recovery operation is required. }
        "502": { description: The isolated Agent control plane, Vault ingress, or Provider probe is unavailable. }
        "503": { description: The isolated Agent control plane is not configured. }
  /settings/agents/credentials/{id}/revoke:
    post:
      operationId: revokeTenantAgentCredential
      description: Immediately revokes the exact tenant credential version. Revocation accepts no client authority and prevents new leases without changing already pinned Agent identities.
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyObject" }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "403": { description: Requires TenantAdmin authority over this credential version. }
        "404": { description: The credential version is not visible to this tenant. }
        "502": { description: The isolated Agent control plane or Vault ingress is unavailable. }
        "503": { description: The isolated Agent control plane is not configured. }
  /settings/agents/profiles:
    post:
      operationId: createTenantAgentProfileRevision
      description: Creates a tenant-scoped immutable Provider and Profile draft. The server derives scope and scopeId from the trusted session, so the browser cannot widen its authority.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantAgentProfileDraft" }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "400": { description: The endpoint, model, authentication, governance, pricing, or budget is invalid. }
        "401": { description: A fresh trusted platform session is required. }
        "403": { description: Requires TenantAdmin authority. }
        "409": { description: The installation or credential is not active and selectable within this tenant. }
        "502": { description: The isolated Agent control plane is unavailable. }
        "503": { description: The isolated Agent control plane is not configured. }
  /settings/agents/profiles/{id}/validate:
    post:
      operationId: validateTenantAgentProfile
      description: Starts the mandatory Provider and policy probes for a tenant-owned draft. Validation does not activate the Profile and cannot replace the current effective configuration on failure.
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ResourceId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmptyObject" }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "403": { description: Requires TenantAdmin authority over this Profile. }
        "404": { description: The Profile does not exist within the tenant-visible scope. }
        "502": { description: The isolated Agent control plane is unavailable. }
        "503": { description: The Agent control plane or trusted Provider Connector is not configured. }
  /settings/agents/default:
    put:
      operationId: updateTenantAgentDefault
      description: Selects an ACTIVE immutable Profile for new tenant tasks. Running and already queued tasks retain their pinned Profile revision.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProfileSelection" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "403": { description: Requires TenantAdmin authority. }
        "409": { description: The Profile is not ACTIVE, serving-ready, or selectable by this tenant. }
        "502": { description: The isolated Agent control plane is unavailable. }
        "503": { description: The isolated Agent control plane is not configured. }
  /projects/repositories:
    get:
      operationId: listAuthorizedProjectRepositories
      description: Lists live repositories for GitHub App installations verified against the signed-in numeric GitHub user. No installation token is returned.
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Current GitHub App repository catalog.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/ProjectRepositoryCatalog" } }
        "401": { description: A fresh trusted platform session is required. }
  /projects:
    get:
      operationId: listRepositoryBoundProjects
      description: Lists at most 500 active projects visible to the signed-in tenant user through project creator authority or a still-active verified GitHub App installation.
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: Tenant-isolated project catalog derived by the Project Repository Broker.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    maxItems: 500
                    items: { $ref: "#/components/schemas/RepositoryBoundProject" }
        "401": { description: A fresh trusted platform session is required. }
    post:
      operationId: createRepositoryBoundProject
      description: The server derives owner, repository name, node ID, and default branch from a fresh GitHub response and atomically persists the project and repository binding.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRepositoryBoundProject" }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "409": { description: The slug or repository is already bound, or the idempotency key has another request digest. }
  /projects/{projectId}:
    get:
      operationId: getRepositoryBoundProject
      description: Returns a project only when the signed-in tenant user created it or still controls its verified active GitHub App installation.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "404": { description: The project is missing or inaccessible to the current account. }
  /projects/{projectId}/agent-settings:
    get:
      operationId: getProjectAgentSettings
      description: Revalidates exact project access and returns only ACTIVE platform, tenant, and same-project Profiles visible through the inherited Agent policy. Credentials and SecretRefs are never returned.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200": { $ref: "#/components/responses/AgentSettings" }
        "401": { description: A fresh trusted platform session is required. }
        "403": { description: The signed-in account is not a ProjectOwner or Auditor. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "502": { description: Project authority or the isolated Agent control plane is unavailable. }
        "503": { description: Project authority or the isolated Agent control plane is not configured. }
    put:
      operationId: updateProjectAgentDefault
      description: Revalidates exact project access and pins an ACTIVE immutable Profile for new project tasks. Running and already queued tasks retain their original Profile revision.
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentProfileSelection" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "403": { description: Requires ProjectOwner authority over the exact project. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "409": { description: The Profile is not ACTIVE, serving-ready, or selectable through project inheritance. }
        "502": { description: Project authority or the isolated Agent control plane is unavailable. }
        "503": { description: Project authority or the isolated Agent control plane is not configured. }
  /projects/{projectId}/steam-settings:
    get:
      operationId: getProjectSteamSettings
      description: Revalidates exact GitHub project access, then reads the active immutable Steam release/depot revision and its build-session readiness. Passwords and SecretRefs are never returned.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Authoritative project Steam release configuration projection.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/SteamProjectConfigurationStatus" } }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "503": { description: The isolated Steam Access Broker is not configured. }
    post:
      operationId: beginProjectSteamSettings
      description: Creates a five-minute, user/session/build-account-bound intent. This operation accepts no request body; App, Depot, branch and branch-password fields are accepted only by the separately hosted Steam Secure UI.
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "201":
          description: Continue release configuration at the fixed-origin isolated Secure UI.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/SteamProjectConfigurationResult" } }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "409": { description: The idempotency key is already bound to another intent. }
        "503": { description: The isolated Steam Access Broker is not configured. }
  /projects/{projectId}/runners:
    get:
      operationId: getProjectRunnerFleet
      description: Revalidates the signed GitHub user's access to the exact project, then returns at most one latest fenced Runner lease per platform. Connectivity is derived from immutable registration state, heartbeat freshness, and certificate expiry; the endpoint has no Runner write authority.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Tenant-isolated project Runner Fleet projection.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/RunnerFleetProjection" } }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "503": { description: The isolated delivery/Runner projection Broker is unavailable. }
  /projects/{projectId}/evidence:
    get:
      operationId: getProjectEvidenceCatalog
      description: Revalidates the signed GitHub user's access to the exact project, then returns the latest 50 immutable evidence manifests after checking canonical bundle digests, authority bindings, platform coverage, and invalidation tombstones. Archive object keys and storage grants are never returned.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200":
          description: Tenant-isolated project Evidence Catalog projection.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: "#/components/schemas/EvidenceCatalogProjection" } }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "503": { description: The isolated evidence projection Broker is unavailable or stored evidence failed verification. }
  /projects/{projectId}/delivery:
    get:
      operationId: getProjectDelivery
      description: Revalidates the signed GitHub user's access to the exact project, then returns the replay-verified Temporal delivery projection. The Web workload has no workflow or database write authority.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is inaccessible or has no production delivery workflow. }
        "503": { description: The project repository or delivery projection Broker is unavailable. }
    post:
      operationId: cancelProjectDelivery
      description: Revalidates exact project access and asks the user-decision Broker to cancel the current replay-verified workflow. Clients cannot submit workflow, Agent, Runner, evidence, or Steam authority.
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: { type: string, const: cancel }
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "202": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "409": { description: The authoritative workflow is terminal or has crossed the irreversible publish boundary. }
  /projects/{projectId}/conversation:
    get:
      operationId: getSpecConversation
      description: Revalidates exact project access before reading the immutable specification conversation snapshot.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
    post:
      operationId: sendSpecConversationMessage
      description: Revalidates exact project access and uses the independent low-latency specification service, never the development Agent.
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, message]
              properties:
                expectedRevision: { type: integer, minimum: 0 }
                message: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "409": { description: Expected revision changed or the command is in progress. }
  /projects/{projectId}/spec-revisions:
    get:
      operationId: getGameSpecRevision
      description: Revalidates exact project access before reading the current immutable specification and test-plan revision.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ProjectId" }]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is inaccessible or has not produced a specification revision. }
    post:
      operationId: approveGameSpecRevision
      description: Revalidates exact project access before approving the current immutable draft and its server-selected Runner toolchain.
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, revision, conversationId, expectedRevision, specRevisionId, testPlanRevisionId]
              properties:
                action: { type: string, enum: [approve] }
                revision: { type: string, minLength: 1, maxLength: 32 }
                conversationId: { type: string, format: uuid }
                expectedRevision: { type: integer, minimum: 1 }
                specRevisionId: { type: string, format: uuid }
                testPlanRevisionId: { type: string, format: uuid }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "409": { description: The specification approval binding changed concurrently. }
        "503": { description: No compatible immutable Runner toolchain is available; no approval was committed. }
  /projects/{projectId}/feedback:
    post:
      operationId: createFeedbackIteration
      description: Revalidates exact project access before creating the next immutable specification draft and invalidating prior candidate evidence.
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [feedback]
              properties: { feedback: { type: string, minLength: 1, maxLength: 4000 } }
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
  /projects/{projectId}/acceptance:
    post:
      operationId: acceptCandidate
      description: Revalidates exact project access, then resolves the authoritative candidate commit, Draft PR, passed E2E attempt, and non-invalidated evidence; clients cannot supply those bindings.
      security: [{ cookieAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ProjectId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              maxProperties: 0
      responses:
        "201": { $ref: "#/components/responses/Ok" }
        "401": { description: A fresh trusted platform session is required. }
        "404": { description: The project is missing or inaccessible to the current account. }
        "409": { description: No single authoritative candidate is awaiting this user's acceptance. }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    cookieAuth: { type: apiKey, in: cookie, name: __Host-deviludo-session }
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 160 }
    ResourceId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ReleaseId:
      name: releaseId
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$" }
  requestBodies:
    VersionAction:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [id]
            properties: { id: { type: string } }
  responses:
    Ok:
      description: Successful response
      content:
        application/json:
          schema:
            type: object
            properties:
              data: {}
              meta: { type: object, additionalProperties: true }
    AgentSettings:
      description: Tenant- and project-scoped public Agent configuration projection.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/AgentSettingsProjection" }
              meta: { type: object, additionalProperties: true }
    AgentHealth:
      description: Role-scoped Agent operational health projection.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [data]
            properties:
              data: { $ref: "#/components/schemas/AgentHealthProjection" }
  schemas:
    EmptyObject:
      type: object
      additionalProperties: false
      maxProperties: 0
    AgentHealthProjection:
      type: object
      additionalProperties: false
      required: [status, installations, providers, supplyChain, isolation, usage, configurationDiffs, alerts, checkedAt]
      properties:
        status: { type: string, enum: [HEALTHY, DEGRADED] }
        installations: { type: array, items: { type: object, additionalProperties: true } }
        providers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, state, probe]
            properties:
              id: { type: string }
              state: { type: string }
              probe: { type: object, additionalProperties: { type: string, enum: [PASS, FAIL] } }
        supplyChain: { type: object, additionalProperties: true, required: [service, status] }
        isolation:
          type: object
          additionalProperties: false
          required: [developmentWorkers, e2eRunnersContainAgent, steamPublishersContainAgent]
          properties:
            developmentWorkers: { const: true }
            e2eRunnersContainAgent: { const: false }
            steamPublishersContainAgent: { const: false }
        usage: { $ref: "#/components/schemas/AgentUsageSummary" }
        configurationDiffs:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/AgentConfigurationDiff" }
        alerts:
          type: array
          items: { $ref: "#/components/schemas/AgentOperationalAlert" }
        checkedAt: { type: string, format: date-time }
    AgentUsageSummary:
      type: object
      additionalProperties: false
      required: [available, source, windowStartedAt, credentialLastUsedAt, totals, records]
      properties:
        available: { type: boolean }
        source: { const: inference_usage_events }
        windowStartedAt: { type: string, format: date-time }
        credentialLastUsedAt:
          type: object
          description: Actor-scoped all-time last-use projection keyed by immutable credential version ID.
          additionalProperties: { type: string, format: date-time }
        totals:
          type: object
          additionalProperties: false
          required: [requests, inputTokens, outputTokens, costUsd]
          properties:
            requests: { type: integer, minimum: 0 }
            inputTokens: { type: integer, minimum: 0 }
            outputTokens: { type: integer, minimum: 0 }
            costUsd: { type: number, minimum: 0 }
        records:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [requestId, tenantId, projectId, runId, providerRevisionId, credentialVersionId, model, inputTokens, outputTokens, costUsd, recordedAt]
            properties:
              requestId: { type: string, format: uuid }
              tenantId: { type: string, format: uuid }
              projectId: { type: string, format: uuid }
              runId: { type: string, format: uuid }
              providerRevisionId: { type: string }
              credentialVersionId: { type: string }
              model: { type: string }
              inputTokens: { type: integer, minimum: 0 }
              outputTokens: { type: integer, minimum: 0 }
              costUsd: { type: number, minimum: 0 }
              recordedAt: { type: string, format: date-time }
    AgentConfigurationDiff:
      type: object
      additionalProperties: false
      required: [id, action, resource, actorId, at, changes]
      properties:
        id: { type: string }
        action: { type: string }
        resource: { type: string }
        actorId: { type: string }
        at: { type: string, format: date-time }
        changes:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [field, before, after]
            properties:
              field: { type: string }
              before: {}
              after: {}
    AgentOperationalAlert:
      type: object
      additionalProperties: false
      required: [id, severity, code, resource, message]
      properties:
        id: { type: string }
        severity: { type: string, enum: [WARNING, CRITICAL] }
        code: { type: string }
        resource: { type: string }
        message: { type: string }
    ControlPlaneReadiness:
      type: object
      additionalProperties: false
      required: [status, service, version, mode, ready, dependencies, capabilities, time]
      properties:
        status: { type: string, enum: [ok, degraded] }
        service: { const: deviludo-control-plane }
        version: { type: string }
        mode: { const: PRODUCTION }
        ready: { type: boolean }
        dependencies:
          type: object
          additionalProperties: false
          required: [identityBroker, identityAdminBroker, githubAuthorizationBroker, projectRepositoryBroker, specificationDialogueBroker, userAcceptanceBroker, deliveryProjectionBroker, adminControlPlaneBroker, steamEnrollmentBroker, steamProjectConfigurationBroker, releaseAuthorizationBroker]
          properties:
            identityBroker: { $ref: "#/components/schemas/ProductionDependencyStatus" }
            identityAdminBroker: { $ref: "#/components/schemas/ProductionDependencyStatus" }
            githubAuthorizationBroker: { $ref: "#/components/schemas/ProductionDependencyStatus" }
            projectRepositoryBroker: { $ref: "#/components/schemas/ProductionDependencyStatus" }
            specificationDialogueBroker: { $ref: "#/components/schemas/ProductionDependencyStatus" }
            userAcceptanceBroker: { $ref: "#/components/schemas/ProductionDependencyStatus" }
            deliveryProjectionBroker: { $ref: "#/components/schemas/ProductionDependencyStatus" }
            adminControlPlaneBroker: { $ref: "#/components/schemas/ProductionDependencyStatus" }
            steamEnrollmentBroker: { $ref: "#/components/schemas/ProductionDependencyStatus" }
            steamProjectConfigurationBroker: { $ref: "#/components/schemas/ProductionDependencyStatus" }
            releaseAuthorizationBroker: { $ref: "#/components/schemas/ProductionDependencyStatus" }
        capabilities:
          type: array
          uniqueItems: true
          items: { type: string }
        time: { type: string, format: date-time }
    ProductionDependencyStatus:
      type: string
      enum: [CONFIGURED, NOT_CONFIGURED, INVALID_CONFIGURATION]
    CredentialDraft:
      type: object
      additionalProperties: false
      required: [label, apiKey]
      properties:
        label: { type: string, minLength: 1, maxLength: 120 }
        apiKey: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 8192 }
    CredentialRotation:
      type: object
      additionalProperties: false
      required: [apiKey]
      properties:
        apiKey: { type: string, format: password, writeOnly: true, minLength: 1, maxLength: 8192 }
    AgentVersionDiscovery:
      type: object
      additionalProperties: false
      properties:
        agent: { type: string, enum: [claude-code, codex-cli], default: claude-code }
        version: { type: string, minLength: 1, maxLength: 100, description: Optional exact official version candidate; floating channels are rejected. }
    AgentInstallationDraft:
      type: object
      additionalProperties: false
      required: [agent, version, workerPool, adapterVersion]
      properties:
        agent: { type: string, enum: [claude-code, codex-cli] }
        version: { type: string, minLength: 1, maxLength: 100 }
        workerPool: { type: string, pattern: "^dev(?:elopment)?[-_A-Za-z0-9]*$", maxLength: 120 }
        adapterVersion: { type: string, minLength: 1, maxLength: 100 }
    AgentProfileSelection:
      type: object
      additionalProperties: false
      required: [profileRevisionId]
      properties:
        profileRevisionId: { type: string, minLength: 1, maxLength: 160 }
    AgentSettingsProjection:
      type: object
      additionalProperties: false
      required: [catalog, platformDefault, effectivePlatformDefaultAgent, selectionPrecedence, pinnedVersionsOnly, profiles, providers, credentials, defaults]
      properties:
        catalog:
          type: array
          maxItems: 2
          items:
            type: object
            additionalProperties: true
            required: [id, name, vendor, officialSource, capabilities, supportedWorkers, installedOn, forbiddenOn, platformDefault, versions, installations]
            properties:
              id: { type: string, enum: [claude-code, codex-cli] }
              name: { type: string }
              vendor: { type: string }
              officialSource: { type: string, format: uri }
              capabilities: { type: array, items: { type: string, enum: [plan, code, repair, review] } }
              supportedWorkers: { type: array, items: { type: string } }
              installedOn: { type: array, items: { type: string } }
              forbiddenOn: { type: array, items: { type: string, enum: [e2e-runner, steam-publisher] } }
              platformDefault: { type: boolean }
              versions: { type: array, items: { type: object, additionalProperties: true } }
              installations: { type: array, items: { type: object, additionalProperties: true } }
        platformDefault: { type: string }
        effectivePlatformDefaultAgent: { type: string, enum: [claude-code, codex-cli] }
        selectionPrecedence:
          type: array
          prefixItems:
            - { const: project }
            - { const: tenant }
            - { const: platform }
            - { const: "built-in:claude-code" }
          minItems: 4
          maxItems: 4
        pinnedVersionsOnly: { const: true }
        profiles: { type: array, items: { type: object, additionalProperties: true } }
        providers: { type: array, items: { type: object, additionalProperties: true } }
        credentials:
          type: array
          items:
            type: object
            additionalProperties: true
            required: [id, familyId, version, label, scope, scopeId, maskedFingerprint, state, createdAt, rotatedAt, lastUsedAt, plaintextRecoverable]
            properties:
              id: { type: string }
              familyId: { type: string }
              version: { type: integer, minimum: 1 }
              label: { type: string }
              scope: { type: string, enum: [platform, tenant] }
              scopeId: { type: string }
              maskedFingerprint: { type: string }
              state: { type: string, enum: [ACTIVE, PREVIOUS, REVOKED] }
              createdAt: { type: string, format: date-time }
              rotatedAt: { type: [string, "null"], format: date-time }
              lastUsedAt: { type: [string, "null"], format: date-time }
              plaintextRecoverable: { const: false }
        defaults: { type: object, additionalProperties: { type: string } }
    GitHubConnectionStatus:
      type: object
      additionalProperties: false
      required: [state, installationCount, accountLogin, repositorySelection, permissions, verifiedAt]
      properties:
        state: { type: string, enum: [CONNECTED, NOT_CONNECTED] }
        installationCount: { type: integer, minimum: 0, maximum: 1000 }
        accountLogin: { type: [string, "null"], maxLength: 100 }
        repositorySelection: { type: [string, "null"], enum: [all, selected, null] }
        permissions: { type: [object, "null"], additionalProperties: { type: string } }
        verifiedAt: { type: [string, "null"], format: date-time }
    GitHubAuthorizationStart:
      type: object
      additionalProperties: false
      required: [authorizeUrl, expiresAt]
      properties:
        authorizeUrl: { type: string, format: uri, pattern: "^https://github\\.com/apps/" }
        expiresAt: { type: string, format: date-time }
    SteamConnectionStatus:
      type: object
      additionalProperties: false
      required: [state, enrollmentId, enrollmentUrl, accountName, allowedAppIds, permissions, verifiedAt, expiresAt]
      properties:
        state: { type: string, enum: [UNCONFIGURED, WAITING_CREDENTIALS, WAITING_STEAM_GUARD, READY] }
        enrollmentId: { type: [string, "null"] }
        enrollmentUrl: { type: [string, "null"], format: uri }
        accountName: { type: [string, "null"], maxLength: 64 }
