name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Analyze Bash deployment scripts
        run: shellcheck -e SC1090,SC1091,SC2317,SC2329 deploy/common/*.sh deploy/web/*.sh deploy/core/*.sh deploy/e2e-linux/*.sh deploy/e2e-macos/*.sh deploy/assets/*.sh deploy/assets/deviludo-e2e-host deploy/assets/deviludo-e2e-renew
      - name: Exercise Bash deployment contracts
        run: npx --no-install bats deploy/tests/bash-deploy.bats
      - run: npm run check
      - name: Start isolated local stack without native macOS host
        run: npm run local:up
        env:
          DEVILUDO_LOCAL_CI: "1"
      - name: Exercise executor, fixture Agent, Godot builder, and object storage
        run: npm run local:executor:test
        env:
          DEVILUDO_SKIP_NATIVE_E2E: "1"
      - name: Quiesce background workers for deterministic database checks
        run: docker compose -f infra/docker-compose.yml stop core-sandbox core-scheduler
      - name: Exercise PostgreSQL RLS, claiming, fencing, recovery, and cancellation
        run: npm run local:database:test
      - name: Capture diagnostics
        if: failure()
        run: npm run local:status && npm run local:logs -- --no-follow
      - name: Remove local stack and volumes
        if: always()
        run: npm run local:reset

  code-e2e:
    name: Code E2E (API and browsers)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium firefox webkit
      - name: Exercise the complete application through APIs and browsers
        run: npm run test:e2e:code
      - name: Upload E2E failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: code-e2e-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  windows-deploy-scripts:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.0
          cache: npm
      - name: Verify the lockfile installs and loads the Windows runtime
        shell: pwsh
        run: |
          npm ci
          node -e "require('sharp'); console.log('Sharp Windows runtime loaded')"
      - name: Install PowerShell analyzers
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force
      - name: Analyze PowerShell deployment scripts
        shell: pwsh
        run: Invoke-ScriptAnalyzer -Path deploy/e2e-windows -Recurse -EnableExit
      - name: Exercise PowerShell deployment contracts
        shell: pwsh
        run: Invoke-Pester -Path deploy/tests/windows-deploy.Tests.ps1 -CI
